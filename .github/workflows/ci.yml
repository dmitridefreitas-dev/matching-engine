name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
        config: [Release, Sanitize]
    name: ${{ matrix.compiler }} / ${{ matrix.config }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.config == 'Sanitize' && 'Debug' || 'Release' }}
          -DLOB_SANITIZE=${{ matrix.config == 'Sanitize' && 'ON' || 'OFF' }}

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          ASAN_OPTIONS: strict_string_checks=1:detect_stack_use_after_return=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

      - name: Smoke-run the benchmark
        if: matrix.config == 'Release'
        run: ./build/lob_bench --ops 200000 --seed 1
